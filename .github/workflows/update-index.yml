name: Update S&Poke 500 index

# Rebuilds the index from live TCGCSV (TCGplayer) prices and commits the
# refreshed data files. Runs hourly, but build_index.py checks TCGCSV's
# last-updated stamp first and exits early unless there's actually a new
# daily snapshot (TCGCSV refreshes ~20:05 UTC), so most runs are one tiny
# request. Scheduled runs only fire on the default branch (GitHub rule);
# use the "Run workflow" button (workflow_dispatch) to run it anywhere.
on:
  schedule:
    - cron: "23 * * * *" # hourly at :23
  workflow_dispatch: {}

# Prevent overlapping runs from racing on the commit.
concurrency:
  group: update-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index (fetch prices, recompute)
        run: python3 scripts/build_index.py

      - name: Commit updated data
        run: |
          git config user.name "spoke-500-bot"
          git config user.email "actions@github.com"
          git add docs/data/latest.json docs/data/history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update S&Poke 500 index ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Per-card daily price series (docs/data/cards_history.json) for ROADMAP
      # item 4 (portfolio vs. the index) and the app's per-card sparklines.
      # Deliberately isolated from everything around it: it runs AFTER the
      # index is committed, reads only the already-built latest.json, fetches
      # nothing, wraps its whole body in try/except and always exits 0.
      # continue-on-error on top of that so this can never turn the build red
      # or stop the newsletter step below from running.
      - name: Record per-card price history
        continue-on-error: true
        run: python3 scripts/record_card_history.py

      # Same guarded commit pattern as latest.json/history.json above; the
      # file only exists once the script has run at least once, and the index
      # is reset at the end so a failure here can't leave staged changes for
      # the newsletter's own chart commit to pick up.
      - name: Commit per-card price history
        continue-on-error: true
        run: |
          if [ ! -f docs/data/cards_history.json ]; then
            echo "No per-card history file yet."
            exit 0
          fi
          git config user.name "spoke-500-bot"
          git config user.email "actions@github.com"
          git add docs/data/cards_history.json
          if git diff --cached --quiet; then
            echo "No per-card history change."
          else
            git commit -m "chore: record per-card prices ($(date -u +%Y-%m-%d))"
            git push
          fi
          git reset -q -- docs/data/cards_history.json || true

      # Full "any card" catalog (docs/data/catalog/) so the iOS app can let a
      # user add any raw English single, not just the index's top 500. Same
      # isolation contract as the step above: runs AFTER the index commit,
      # reads the snapshot build_index.py already downloaded (.cache/, never
      # committed) instead of re-fetching, wraps everything in try/except and
      # always exits 0. On an hourly no-op run there is no cache, so it does
      # nothing and makes zero requests.
      - name: Publish any-card catalog
        continue-on-error: true
        run: python3 scripts/publish_catalog.py

      # Same guarded commit pattern as the two above. The index is reset at
      # the end so a failure here can't leave staged changes behind for the
      # newsletter's own chart commit to pick up.
      - name: Commit any-card catalog
        continue-on-error: true
        run: |
          if [ ! -f docs/data/catalog/sets.json ]; then
            echo "No catalog published this run."
            exit 0
          fi
          git config user.name "spoke-500-bot"
          git config user.email "actions@github.com"
          git add docs/data/catalog
          if git diff --cached --quiet; then
            echo "No catalog change."
          else
            git commit -m "chore: publish card catalog ($(date -u +%Y-%m-%d))"
            git push
          fi
          git reset -q -- docs/data/catalog || true

      # No-op until the BUTTONDOWN_API_KEY repo secret exists. The script
      # itself enforces the weekly cadence (Fridays, first issue immediately)
      # and only sends from the build that ingested TODAY's TCGCSV snapshot.
      # matplotlib powers the issue's chart; if it's missing or fails the
      # script sends the plain-text fallback instead, so this install is
      # best-effort by design.
      - name: Install chart dependency
        run: pip install matplotlib --quiet || true

      - name: Send weekly newsletter (Buttondown)
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python3 scripts/send_newsletter.py

      # After a send, the script snapshots constituent prices into
      # newsletter_state.json so next week's issue can report week-over-week
      # movers. Commit it so the baseline survives to the next run.
      - name: Persist newsletter state
        run: |
          # The state file only exists once the first issue has been sent;
          # until then this step is a no-op (git add on a missing path fails
          # the whole run otherwise).
          if [ ! -f docs/data/newsletter_state.json ]; then
            echo "No newsletter state file yet (no issue sent)."
            exit 0
          fi
          git add docs/data/newsletter_state.json
          if git diff --cached --quiet; then
            echo "No newsletter state change."
          else
            git commit -m "chore: record newsletter issue ($(date -u +%Y-%m-%d))"
            git push
          fi
